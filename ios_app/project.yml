name: APEX_iOS
options:
  bundleIdPrefix: club.apex.lifemaxx
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  APEX_iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - Widgets/**
          - Watch/**
          - generate_ios_icon.swift
          - project.yml
      - path: Widgets/ApexWidgetIntents.swift
    resources:
      - Assets.xcassets
    info:
      path: Info.plist
    entitlements:
      path: APEX_iOS.entitlements
    dependencies:
      - target: APEXWidgets
        embed: true
      - target: APEXWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.apex.lifemaxx.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-weak_framework FoundationModels"

  APEXWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ApexSharedTypes.swift
      - Widgets/ApexWidgetIntents.swift
      - Widgets/ApexWidgets.swift
    info:
      path: Widgets/Info.plist
    entitlements:
      path: Widgets/APEXWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.apex.lifemaxx.ios.widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  APEXWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - ApexSharedTypes.swift
      - Watch/APEXWatchApp.swift
    info:
      path: Watch/Info.plist
    entitlements:
      path: Watch/APEXWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.apex.lifemaxx.ios.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
